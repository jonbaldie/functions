name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, pdo, sodium, dom, xml, xmlwriter
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpunit ./tests --testdox
      - run: ./vendor/bin/phan --allow-polyfill-parser
      - run: ./vendor/bin/phpa ./src
      - name: Test the FastCGI environment boundary
        run: |
          mkdir -p "$RUNNER_TEMP/functions-fpm"
          cd "$RUNNER_TEMP/functions-fpm"
          apt-get download php8.1-fpm
          dpkg-deb -x php8.1-fpm_*.deb .
          PHP_FPM_BIN="$RUNNER_TEMP/functions-fpm/usr/sbin/php-fpm8.1" python3 "$GITHUB_WORKSPACE/tests/fpm-env.py"
