name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, pdo, sodium, dom, xml, xmlwriter
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/phpunit ./tests --testdox
      - run: ./vendor/bin/phan --allow-polyfill-parser
      - run: ./vendor/bin/phpa ./src
