name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  routing-trace:
    name: routing trace regression
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: xdebug
      - run: php -d xdebug.mode=trace -d xdebug.start_with_request=no tests/routing-trace.php

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, openssl, pdo, sodium, dom, xml, xmlwriter
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack yarn install --frozen-lockfile
      - name: Test the welcome page entrypoint
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          corepack yarn encore dev
          python3 tests/entrypoint.py
          corepack yarn encore production
          python3 tests/entrypoint.py
          bash tests/asset-polyfills.sh
      - run: ./vendor/bin/phpunit ./tests --testdox
      - run: ./vendor/bin/phan --allow-polyfill-parser
      - run: ./vendor/bin/phpa ./src
      - name: Test the FastCGI environment boundary
        run: |
          mkdir -p "$RUNNER_TEMP/functions-fpm"
          cd "$RUNNER_TEMP/functions-fpm"
          sudo apt-get update
          apt-get download php8.3-fpm
          dpkg-deb -x php8.3-fpm_*.deb .
          PHP_FPM_BIN="$RUNNER_TEMP/functions-fpm/usr/sbin/php-fpm8.3" python3 "$GITHUB_WORKSPACE/tests/fpm-env.py"
